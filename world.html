<canvas id="world" aria-label="Interactive top-down HYDRA station. Drag to pan, pinch to zoom, tap agents or rooms."></canvas>
<aside id="sidebar"><h2>◈ AI PERSONNEL</h2><div class="tabs"><button class="active" data-filter="all">ALL</button><button data-filter="busy">ACTIVE</button><button data-filter="idle">IDLE</button></div><div id="roster"></div></aside>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),g=canvas.getContext('2d'),TAU=Math.PI*2,storageKey='hydra-world-v2';
const rooms=[
{id:'command',name:'COMMAND NEXUS',x:0,y:-385,w:410,h:300,accent:'#f45881',kind:'COMMAND',desc:'Strategic coordination, triage and approvals.'},
{id:'research',name:'INTELLIGENCE',x:-485,y:-385,w:330,h:300,accent:'#54cbe2',kind:'RESEARCH',desc:'Investigate leads, verify requirements and summarize findings.'},
{id:'forge',name:'FORGE LAB',x:485,y:-385,w:330,h:300,accent:'#ffc16d',kind:'BUILD',desc:'Prototyping, code review and quality checks.'},
{id:'core',name:'JARVIS CORE',x:0,y:0,w:410,h:300,accent:'#db73ff',kind:'CORE',desc:'Agent orchestration and decision visualization.'},
{id:'market',name:'MARKET OBSERVATORY',x:-485,y:0,w:330,h:300,accent:'#65aaff',kind:'PAPER',desc:'Paper-only market observation; no orders are placed.'},
{id:'clients',name:'CLIENT OPERATIONS',x:485,y:0,w:330,h:300,accent:'#77ffad',kind:'CLIENT',desc:'Review customer leads and contract status.'},
{id:'archive',name:'MEMORY ARCHIVE',x:0,y:385,w:410,h:300,accent:'#f6d16d',kind:'MEMORY',desc:'Local simulation history and event records.'},
{id:'life',name:'LIFE ENGINE',x:-485,y:385,w:330,h:300,accent:'#ff81ba',kind:'LIFE',desc:'Simulated schedules, shifts and task allocation.'},
{id:'build',name:'AUTOMATION BAY',x:485,y:385,w:330,h:300,accent:'#7ce2ff',kind:'AUTOMATION',desc:'Safe workflow design and integration planning.'}
];
const agentNames=['JARVIS','ATLAS','FORGE','VECTOR','NOVA','ECHO','SCOUT','SENTINEL','CIPHER','ORBIT','PIXEL','PRISM','GHOST','SPARK','NEXUS','PULSE'];
const roles=['Director','Strategist','Engineer','Analyst','Researcher','Memory Keeper','Scout','Security','Developer','Navigator','Designer','QA','Auditor','Marketing','Coordinator','Observer'];
const colors=['#ff6988','#80b9ff','#ffce73','#83f9c1','#d99aff','#ff99b9'];
const tasks0=[
{title:'Inspect revenue lead sources',room:1,agent:4,description:'Simulation only. Examine which feeds would be useful; do not claim outreach.',duration:42},
{title:'Review client pipeline',room:5,agent:6,description:'Simulated planning; no applications or proposals sent.',duration:55},
{title:'Plan Jarvis runtime diagnostics',room:3,agent:0,description:'Define checks for stalled ticks, supervisor and action ledger.',duration:75},
{title:'Design safe automation',room:8,agent:2,description:'Prepare a local-only workflow outline without deployment.',duration:63},
{title:'Review UI quality',room:2,agent:11,description:'Inspect layout, interactions and accessibility.',duration:40},
{title:'Archive simulation events',room:6,agent:5,description:'Store a local event summary, not backend memory.',duration:50}
];
let stored={};try{stored=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
let nextId=1,logs=Array.isArray(stored.logs)?stored.logs.slice(-80):[],tasks=Array.isArray(stored.tasks)?stored.tasks:tasks0.map((t,i)=>({...t,id:i+1,status:'queued',progress:0}));nextId=Math.max(0,...tasks.map(t=>Number(t.id)||0))+1;
let agents=agentNames.map((name,i)=>({id:i,name,role:roles[i],color:colors[i%colors.length],room:i%rooms.length,target:i%rooms.length,x:rooms[i%rooms.length].x+(i%4-1.5)*32,y:rooms[i%rooms.length].y+((i%3)-1)*30,state:'idle',wait:i%5,phase:i*.7,task:null}));
let selected={kind:'room',id:3},filter='all',time=Number(stored.time)||0,paused=false,speed=1,cam={x:0,y:0,z:.5},size={w:0,h:0},pointers=new Map(),gesture=null,last=performance.now(),frameCount=0,lastFps=performance.now(),particles=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,2800)}
function event(s){const t=new Date().toLocaleTimeString();logs.push({t,text:s});if(logs.length>90)logs.shift();$('feed').textContent='['+t+'] '+s}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({time,tasks,logs}))}catch{}}setInterval(save,9000);
function fit(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);size.w=r.width;size.h=r.height;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);if(!fit.did){cam.z=Math.min(.67,Math.max(.23,Math.min((r.width-70)/1690,(r.height-25)/1260)));fit.did=true}}
function world(px,py){const r=canvas.getBoundingClientRect();return{x:(px-r.left-size.w/2-cam.x)/cam.z,y:(py-r.top-size.h/2-cam.y)/cam.z}}
function line(x,y,xx,yy,color,width){g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke()}
function rect(x,y,w,h,fill,stroke,lw=1){g.fillStyle=fill;g.fillRect(x,y,w,h);if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.strokeRect(x,y,w,h)}}
function pathRound(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function roomDraw(r,i,t){const{x,y,w,h,accent}=r;g.save();g.translate(x,y);g.shadowColor=accent;g.shadowBlur=18;g.fillStyle='#0e111b';pathRound(-w/2-12,-h/2-12,w+24,h+24,19);g.fill();g.shadowBlur=0;g.strokeStyle='#5c616e';g.lineWidth=12;g.stroke();g.strokeStyle='#151a25';g.lineWidth=6;g.stroke();g.strokeStyle=accent;g.lineWidth=2;g.stroke();
g.save();pathRound(-w/2,-h/2,w,h,7);g.clip();rect(-w/2,-h/2,w,h,'#202029');for(let xx=-w/2;xx<w/2;xx+=25)line(xx,-h/2,xx,h/2,'#292d36',1);for(let yy=-h/2;yy<h/2;yy+=25)line(-w/2,yy,w/2,yy,'#292d36',1);
for(let k=0;k<16;k++){const xx=-w/2+36+(k%4)*(w-72)/3,yy=-h/2+67+Math.floor(k/4)*(h-112)/3;g.save();g.translate(xx,yy);rect(-16,-13,32,25,'#11131a','#68727d',2);rect(-12,-10,24,8,k%3===0?accent:'#4fadb2');rect(-11,3,22,6,'#252f36');g.fillStyle='#111722';g.fillRect(-4,13,8,9);g.restore()}
for(let k=0;k<4;k++){const xx=-w/2+30+k*(w-60)/3;rect(xx-12,-h/2+10,24,10,accent);rect(xx-12,h/2-18,24,7,accent)}
g.restore();g.fillStyle='#0a0d16';g.fillRect(-w/2+13,-h/2+15,w-26,29);g.fillStyle=accent;g.textAlign='center';g.font='bold 17px monospace';g.shadowColor=accent;g.shadowBlur=9;g.fillText(r.name,0,-h/2+36);g.shadowBlur=0;g.fillStyle='#b9b5c1';g.font='10px monospace';g.fillText('SECTOR '+String(i+1).padStart(2,'0')+' / '+r.kind,0,h/2-15);
if(selected.kind==='room'&&selected.id===i){g.strokeStyle='#fff';g.lineWidth=3;pathRound(-w/2-17,-h/2-17,w+34,h+34,20);g.stroke()}
g.restore()}
const hallEdges=[[0,1],[0,2],[3,4],[3,5],[6,7],[6,8],[0,3],[3,6],[1,4],[4,7],[2,5],[5,8]];
function draw(t){const w=size.w,h=size.h;g.clearRect(0,0,w,h);rect(0,0,w,h,'#05060c');g.save();g.translate(w/2+cam.x,h/2+cam.y);g.scale(cam.z,cam.z);
for(let i=0;i<360;i++){const x=(i*1613%2400)-1200,y=(i*2879%2100)-1050;g.globalAlpha=.15+(i%6)*.08;rect(x,y,i%7?2:3,i%7?2:3,i%4?'#7b82a4':'#b2c4ff')}g.globalAlpha=1;
for(const [a,b] of hallEdges){const p=rooms[a],q=rooms[b];g.lineCap='round';line(p.x,p.y,q.x,q.y,'#2c2135',97);line(p.x,p.y,q.x,q.y,'#69707c',75);line(p.x,p.y,q.x,q.y,'#10141e',59);line(p.x,p.y,q.x,q.y,'#7e3a70',3)}
rooms.forEach((r,i)=>roomDraw(r,i,t));
for(let i=0;i<agents.length;i++){const a=agents[i];g.save();g.translate(a.x,a.y);g.shadowColor=a.color;g.shadowBlur=12;g.fillStyle='#151721';g.beginPath();g.ellipse(0,7,11,5,0,0,TAU);g.fill();g.fillStyle=a.color;g.beginPath();g.arc(0,0,9,0,TAU);g.fill();g.shadowBlur=0;g.fillStyle='#10111a';g.fillRect(-4,-4,8,5);g.fillStyle='#dceaff';g.font='bold 10px monospace';g.textAlign='center';g.fillText(a.name,0,-16);if(selected.kind==='agent'&&selected.id===a.id){g.strokeStyle='white';g.lineWidth=2;g.beginPath();g.arc(0,0,15,0,TAU);g.stroke()}g.restore()}
g.restore()}
function findRoom(x,y){return rooms.findIndex(r=>Math.abs(x-r.x)<r.w/2&&Math.abs(y-r.y)<r.h/2)}
function getTask(a){return tasks.find(t=>t.id===a.task)}
function assign(){for(const t of tasks){if(t.status==='done'||t.status==='cancelled')continue;const a=agents[t.agent];if(!a){t.status='queued';continue}if(t.status==='active'){a.task=t.id;a.state='working';a.target=t.room;continue}if(t.status==='queued'&&!a.task){t.status='active';a.task=t.id;a.target=t.room;a.state='walking';event(a.name+' assigned: '+t.title)}}}
function advance(dt){time+=dt;assign();for(const a of agents){const r=rooms[a.target];if(a.task){const dx=r.x-a.x,dy=r.y-a.y,d=Math.hypot(dx,dy);if(d>45){const step=Math.min(d,55*dt);a.x+=dx/d*step;a.y+=dy/d*step;a.state='walking'}else{a.room=a.target;a.state='working';const task=getTask(a);if(task&&task.status==='active'){task.progress=Math.min(100,(task.progress||0)+dt*100/(task.duration||45));if(task.progress>=100){task.status='done';a.task=null;a.state='idle';a.wait=2;event(a.name+' finished simulated task: '+task.title);toast('Simulation completed: '+task.title)}}}}else{a.wait-=dt;if(a.wait<=0){a.target=(a.target+1+(a.id%4))%rooms.length;a.wait=6+a.id%7}const dx=r.x-a.x,dy=r.y-a.y,d=Math.hypot(dx,dy);if(d>20){const step=Math.min(d,35*dt);a.x+=dx/d*step;a.y+=dy/d*step;a.state='patrolling'}else{a.room=a.target;a.state='idle'}}}}
function renderRoster(){const list=agents.filter(a=>filter==='all'||(filter==='busy'?!!a.task:!a.task));$('roster').innerHTML=list.map(a=>'<div class="person '+(selected.kind==='agent'&&selected.id===a.id?'selected':'')+'" data-agent="'+a.id+'"><span class="avatar" style="color:'+a.color+'">'+a.name.slice(0,2)+'</span><span class="info"><b>'+a.name+'</b><small>'+esc(a.role)+'</small></span><em>'+(!a.task?'IDLE':a.state==='walking'?'MOVE':'BUSY')+'</em></div>').join('')}
function renderTasks(){$('taskcount').textContent=tasks.filter(t=>t.status==='active'||t.status==='queued').length;$('tasklist').innerHTML=tasks.filter(t=>t.status!=='cancelled').slice(-12).reverse().map(t=>'<div class="taskrow" data-task="'+t.id+'"><b>'+esc(t.title)+'</b><small>'+esc(t.status.toUpperCase())+' · '+esc(agents[t.agent]?.name||'UNASSIGNED')+'</small><div class="progress"><i style="width:'+Math.min(100,t.progress||0)+'%"></i></div></div>').join('')||'<div class="taskrow">No tasks queued.</div>'}
function optionsAgent(id){return agents.map(a=>'<option value="'+a.id+'" '+(a.id===id?'selected':'')+'>'+a.name+'</option>').join('')}
function optionsRoom(id){return rooms.map((r,i)=>'<option value="'+i+'" '+(i===id?'selected':'')+'>'+r.name+'</option>').join('')}
function inspect(){if(selected.kind==='agent'){const a=agents[selected.id],task=getTask(a);$('inspect').innerHTML='<div class="big">'+a.name+'</div><div class="type">'+esc(a.role.toUpperCase())+' · SIMULATED AGENT</div><p><b>Status:</b> '+esc(a.state)+'<br><b>Location:</b> '+rooms[a.room].name+'<br><b>Current task:</b> '+esc(task?.title||'None')+'</p><button class="primary" id="newTask">＋ ASSIGN TASK</button><button id="follow">⌖ CENTER ON AGENT</button><p class="warn">This agent is a visual simulation, not an autonomous worker.</p>'}else if(selected.kind==='task'){const t=tasks.find(t=>t.id===selected.id);if(!t){selected={kind:'room',id:3};inspect();return}$('inspect').innerHTML='<div class="big">'+esc(t.title)+'</div><div class="type">MISSION · '+esc(t.status.toUpperCase())+'</div><p>'+esc(t.description||'')+'</p><p>Assigned: '+esc(agents[t.agent]?.name||'None')+'<br>Sector: '+esc(rooms[t.room]?.name||'Unknown')+'<br>Progress: '+Math.round(t.progress||0)+'%</p><button id="cancelTask" '+(t.status==='done'?'disabled':'')+'>CANCEL SIMULATION TASK</button><p class="warn">Completion means only the local simulated timer finished.</p>'}else{const r=rooms[selected.id];$('inspect').innerHTML='<div class="big">'+r.name+'</div><div class="type">'+r.kind+' · SECTOR '+String(selected.id+1).padStart(2,'0')+'</div><p>'+r.desc+'</p><p><b>Occupants:</b> '+agents.filter(a=>a.room===selected.id).map(a=>a.name).join(', ')+'</p><button class="primary" id="roomTask">＋ CREATE MISSION HERE</button><button id="roomCenter">⌖ CENTER ON SECTOR</button><p class="warn">Live Jarvis telemetry is not connected.</p>'}}
function choose(kind,id){selected={kind,id};inspect();renderRoster()}
function center(x=0,y=0){cam.x=-x*cam.z;cam.y=-y*cam.z}
function openModal(html){$('modal').innerHTML=html;$('modalback').classList.add('open')}function closeModal(){$('modalback').classList.remove('open')}
function taskModal(agent=0,room=3){openModal('<div class="row"><h2>NEW SIMULATED MISSION</h2><button class="close" id="closeModal">✕</button></div><p>Create a local task. This will move an animated agent and advance a progress bar; it will not contact customers or execute code.</p><div class="inspect"><label>Mission name</label><input id="taskTitle" maxlength="90" placeholder="e.g. Review Shopify listings" style="width:100%;padding:10px;background:#191522;color:white;border:1px solid #73314a"><label>Agent</label><select id="taskAgent">'+optionsAgent(agent)+'</select><label>Destination</label><select id="taskRoom">'+optionsRoom(room)+'</select><label>Notes</label><textarea id="taskDescription" maxlength="700" placeholder="What should this simulated task represent?"></textarea><button class="primary" id="submitTask">ADD TO QUEUE</button></div>')}
function modalInfo(){openModal('<div class="row"><h2>HYDRA LIVING WORLD</h2><button class="close" id="closeModal">✕</button></div><p><b>Controls:</b> drag to pan, pinch or scroll to zoom, tap agents, workstations, or rooms to inspect. Use the personnel panel to locate an agent. Missions can be assigned, queued, cancelled and saved locally.</p><p><b>Simulation boundary:</b> agents, progress, patrols, activity and missions are local animations. The website is not connected to your Windows Jarvis runtime, authenticated marketplaces, payments or trading accounts. Completing a mission does not complete real work.</p><p><b>Persistence:</b> mission queue, event history and simulation clock are saved in this browser only. No account credentials are requested.</p><p><a href="operations.html">Open operations and revenue monitor ↗</a></p>')}
function settingsModal(){openModal('<div class="row"><h2>STATION CONTROLS</h2><button class="close" id="closeModal">✕</button></div><p>Local simulation state only. No external commands.</p><div class="inspect"><button id="exportState">EXPORT LOCAL EVENT LOG</button><button id="clearDone">CLEAR COMPLETED MISSIONS</button><button id="resetState">RESET LOCAL SIMULATION</button><button id="addMission">＋ NEW MISSION</button></div>')}
$('roster').onclick=e=>{const row=e.target.closest('[data-agent]');if(row){const a=agents[+row.dataset.agent];choose('agent',a.id);center(a.x,a.y)}};$('tasklist').onclick=e=>{const row=e.target.closest('[data-task]');if(row)choose('task',+row.dataset.task)};
$('sidebar').querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderRoster()};
$('inspector').onclick=e=>{const id=e.target.id;if(id==='newTask'){const a=agents[selected.id];taskModal(a.id,a.room)}else if(id==='roomTask')taskModal(0,selected.id);else if(id==='follow'){const a=agents[selected.id];center(a.x,a.y)}else if(id==='roomCenter'){const r=rooms[selected.id];center(r.x,r.y)}else if(id==='cancelTask'){const t=tasks.find(x=>x.id===selected.id);if(t&&t.status!=='done'){t.status='cancelled';const a=agents[t.agent];if(a?.task===t.id)a.task=null;event('Cancelled simulated mission: '+t.title);save();renderTasks();inspect()}}};
$('modal').onclick=e=>{const id=e.target.id;if(id==='closeModal')closeModal();else if(id==='submitTask'){const title=$('taskTitle').value.trim(),agent=Number($('taskAgent').value),room=Number($('taskRoom').value),description=$('taskDescription').value.trim();if(!title){toast('Enter a mission name');return}const t={id:nextId++,title,agent,room,description,duration:40+title.length%40,progress:0,status:'queued'};tasks.push(t);event('Mission queued: '+title);closeModal();renderTasks();save();choose('task',t.id)}else if(id==='exportState'){const data=JSON.stringify({exportedAt:new Date().toISOString(),mode:'simulation',tasks,logs},null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='hydra-simulation-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Local simulation log exported')}else if(id==='clearDone'){tasks=tasks.filter(t=>t.status!=='done'&&t.status!=='cancelled');save();renderTasks();closeModal();toast('Completed simulations cleared')}else if(id==='resetState'){if(confirm('Reset local missions and event log? This does not affect real HYDRA.')){localStorage.removeItem(storageKey);location.reload()}}else if(id==='addMission'){closeModal();taskModal()}};
$('modalback').onclick=e=>{if(e.target===$('modalback'))closeModal()};
$('zoomIn').onclick=()=>cam.z=Math.min(1.8,cam.z*1.23);$('zoomOut').onclick=()=>cam.z=Math.max(.18,cam.z/1.23);$('center').onclick=()=>{center();fit.did=false;fit()};$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ';e.target.classList.toggle('active',paused);event(paused?'Simulation paused':'Simulation resumed')};$('speed').onclick=e=>{speed=speed===1?2:speed===2?4:.5===speed?1:.5;e.target.textContent=speed+'×';event('Simulation speed '+speed+'×')};$('help').onclick=modalInfo;$('settings').onclick=settingsModal;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)gesture={x:e.clientX,y:e.clientY,dist:0};else gesture=null});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const arr=[...pointers.values()];if(arr.length===2){const d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);if(pointers.prevDist)cam.z=Math.max(.18,Math.min(1.8,cam.z*d/pointers.prevDist));pointers.prevDist=d}else if(gesture){cam.x+=e.clientX-old.x;cam.y+=e.clientY-old.y;gesture.dist+=Math.abs(e.clientX-old.x)+Math.abs(e.clientY-old.y)}});
function end(e){if(gesture&&gesture.dist<12&&pointers.size===1){const p=world(e.clientX,e.clientY);const a=agents.find(a=>Math.hypot(a.x-p.x,a.y-p.y)<22);if(a)choose('agent',a.id);else{const r=findRoom(p.x,p.y);if(r>=0)choose('room',r)}}pointers.delete(e.pointerId);if(!pointers.size){gesture=null;pointers.prevDist=null}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.18,Math.min(1.8,cam.z*(e.deltaY>0?.9:1.1)))},{passive:false});
let uiAccum=0;function tick(t){const dt=Math.min((t-last)/1000,.06);last=t;if(!paused)advance(dt*speed);draw(t);uiAccum+=dt;if(uiAccum>.4){uiAccum=0;renderRoster();renderTasks();if(selected.kind==='agent'||selected.kind==='room')inspect();$('activecount').textContent=agents.filter(a=>!!a.task).length;$('simtime').textContent=new Date(time*1000).toISOString().slice(11,19);$('headerclock').textContent='CYCLE '+String(Math.floor(time/15)).padStart(4,'0')}frameCount++;if(t-lastFps>1000){$('fps').textContent=frameCount;frameCount=0;lastFps=t}requestAnimationFrame(tick)}
window.addEventListener('resize',fit);fit();choose('room',3);renderTasks();event('Living World ready. Jarvis backend disconnected.');requestAnimationFrame(tick);
})();
</script></body></html>
