<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('stage'),c=cv.getContext('2d',{alpha:false}),T=32,C=53,R=39,N=C*R;
const roomDefs=[
['COMMAND BRIDGE',4,3,16,10,'#ff638b','Strategic task coordination'],
['RESEARCH LAB',22,3,13,10,'#52f6e2','Investigation and evidence review'],
['ENGINEERING',39,3,11,10,'#ffc169','Prototypes and QA'],
['JARVIS CORE',19,16,15,10,'#cf82ff','Decision system visualization'],
['MARKET WATCH',3,17,12,9,'#7abaff','Paper-only market observation'],
['CLIENT OPS',39,17,11,9,'#7dffa2','Review unverified opportunities'],
['MEMORY VAULT',4,29,13,8,'#f6d56e','Local simulation event archive'],
['LIFE ENGINE',21,29,13,8,'#fa7cbd','Simulation scheduling and staffing'],
['AUTOMATION BAY',39,29,11,8,'#69dcff','Safe workflow planning']
];
const rooms=roomDefs.map((d,id)=>({id,name:d[0],x:d[1],y:d[2],w:d[3],h:d[4],color:d[5],desc:d[6],seats:[]}));
const map=new Uint8Array(N),objects=[],lights=[],stars=Array.from({length:190},(_,i)=>({x:(i*7213)%2200-260,y:(i*2939)%1800-260,s:i%7===0?2:1}));const idx=(x,y)=>y*C+x,inside=(x,y)=>x>=0&&y>=0&&x<C&&y<R;
function carve(x,y,w,h){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)if(inside(xx,yy))map[idx(xx,yy)]=1}
rooms.forEach(r=>carve(r.x,r.y,r.w,r.h));
function corridor(x1,y1,x2,y2){const h=Math.min(x1,x2),w=Math.abs(x2-x1)+1,v=Math.min(y1,y2),hh=Math.abs(y2-y1)+1;carve(h,y1,w,2);carve(x2,v,2,hh)}
// Each corridor intersects the interior of both rooms. Doors are physical openings, never teleport points.
corridor(19,7,23,7);corridor(35,7,40,7);
corridor(10,12,10,19);corridor(28,12,28,18);corridor(44,12,44,19);
corridor(13,21,22,21);corridor(33,21,40,21);
corridor(9,24,9,31);corridor(27,24,27,31);corridor(44,24,44,31);
corridor(16,33,22,33);corridor(33,33,40,33);
// Corridor backbone with branches to each sector; all pathways stay on carved tiles.
corridor(10,14,44,14);corridor(10,27,44,27);corridor(17,14,17,27);corridor(37,14,37,27);
const blocked=new Uint8Array(N);const objectAt=(x,y)=>objects.find(o=>o.x===x&&o.y===y);
function obj(x,y,type,color,room,solid=true){if(!inside(x,y)||!map[idx(x,y)])return;objects.push({x,y,type,color,room});if(solid)blocked[idx(x,y)]=1}
for(const r of rooms){for(let yy=r.y+2;yy<r.y+r.h-1;yy+=3){for(let xx=r.x+2;xx<r.x+r.w-1;xx+=3){if((xx+yy)%4===0)continue;obj(xx,yy,(xx+yy)%5===0?'reactor':(xx%3===0?'terminal':'desk'),r.color,r.id)}}for(let j=0;j<2;j++){const x=r.x+r.w-2,y=r.y+2+j*3;obj(x,y,'plant','#7cffaf',r.id)}}
function walk(x,y){return inside(x,y)&&map[idx(x,y)]===1&&!blocked[idx(x,y)]}
function neighbors(x,y){const a=[];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])if(walk(x+dx,y+dy))a.push([x+dx,y+dy]);return a}
function near(x,y){if(walk(x,y))return[x,y];for(let d=1;d<12;d++)for(let dy=-d;dy<=d;dy++)for(let dx=-d;dx<=d;dx++)if(walk(x+dx,y+dy))return[x+dx,y+dy];return[10,14]}
for(const r of rooms){for(const o of objects.filter(o=>o.room===r.id)){for(const [nx,ny] of neighbors(o.x,o.y))if(!r.seats.some(p=>p[0]===nx&&p[1]===ny))r.seats.push([nx,ny])}if(!r.seats.length)r.seats.push(near(r.x+2,r.y+2))}
function route(sx,sy,ex,ey){[sx,sy]=near(sx,sy);[ex,ey]=near(ex,ey);const start=idx(sx,sy),goal=idx(ex,ey);if(start===goal)return[[ex,ey]];const queue=[start],prev=new Int32Array(N).fill(-1),seen=new Uint8Array(N);seen[start]=1;for(let head=0;head<queue.length;head++){const n=queue[head];if(n===goal)break;const x=n%C,y=(n/C)|0;for(const [nx,ny] of neighbors(x,y)){const k=idx(nx,ny);if(!seen[k]){seen[k]=1;prev[k]=n;queue.push(k)}}}if(!seen[goal])return[];const path=[];for(let k=goal;k!==start;k=prev[k]){if(k<0)return[];path.push([k%C,(k/C)|0])}return path.reverse()}
const names=['JARVIS','ATLAS','FORGE','VECTOR','NOVA','ECHO','SCOUT','SENTINEL','CIPHER','ORBIT','PIXEL','PRISM','GHOST','SPARK','NEXUS','PULSE'],roles=['Director','Strategist','Engineer','Analyst','Researcher','Archivist','Scout','Security','Developer','Navigator','Designer','QA','Auditor','Growth','Coordinator','Observer'];
const outfits=['#ef718d','#69c8ff','#ffc87a','#9bffb0','#d69fff','#e9bfff'];
const crew=names.map((name,id)=>{const r=rooms[id%rooms.length],p=r.seats[(id*3)%r.seats.length];return{id,name,role:roles[id],color:outfits[id%outfits.length],x:p[0]+.5,y:p[1]+.5,room:r.id,target:r.id,path:[],work:null,wait:id%5,phase:id*.9,dir:2,state:'idle'}});
const seedTasks=[['Review source health',1,4,38],['Inspect Jarvis runtime plan',3,0,58],['Review client leads',5,6,45],['Draft safe workflow',8,2,50],['Inspect QA checklist',2,11,42]];
const storeKey='hydra-living-v4';let stored={};try{stored=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
let tasks=Array.isArray(stored.tasks)?stored.tasks:seedTasks.map((x,i)=>({id:i+1,title:x[0],room:x[1],agent:x[2],duration:x[3],progress:0,status:'queued',kind:'simulation',note:'Simulation only; no external action.'})),nextId=Math.max(0,...tasks.map(x=>+x.id||0))+1,logs=Array.isArray(stored.logs)?stored.logs.slice(-60):[];
tasks.forEach(t=>{if(t.kind==='live'&&['active','running'].includes(t.status)){t.status='queued';t.progress=0}});let time=Number(stored.time)||0,paused=false,speed=1,selected={type:'room',id:3},filter='all',cam={x:0,y:0,z:.72},size={w:0,h:0},pointer=new Map(),gesture=null,theme=stored.theme||'green',last=performance.now(),refresh=0;

function escapeHTML(s){return String(s).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]))}

function themeApply(){const palettes={green:['#66f8a2','#267a59'],magenta:['#ff6ab5','#9a3d79'],blue:['#6abfff','#3e739e']};const p=palettes[theme]||palettes.green;document.documentElement.style.setProperty('--accent',p[0]);document.documentElement.style.setProperty('--edge',p[1])}themeApply();
function resize(){const b=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);size.w=b.width;size.h=b.height;cv.width=Math.round(b.width*d);cv.height=Math.round(b.height*d);c.setTransform(d,0,0,d,0,0);if(!resize.did){cam.z=Math.min(1.1,Math.max(.26,Math.min(b.width/(C*T+80),b.height/(R*T+60))*1.45));center();resize.did=true}}
function center(){cam.x=-(C*T/2)*cam.z;cam.y=-(R*T/2)*cam.z}
function screenToWorld(x,y){const b=cv.getBoundingClientRect();return{x:(x-b.left-size.w/2-cam.x)/cam.z,y:(y-b.top-size.h/2-cam.y)/cam.z}}
function rand(x,y){let z=(x*374761393+y*668265263)>>>0;z=Math.imul(z^(z>>>13),1274126177);return ((z^(z>>>16))>>>0)/4294967295}
function tile(x,y,fill){c.fillStyle=fill;c.fillRect(x*T,y*T,T,T)}
function glow(x,y,r,color,alpha){const gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'transparent');c.globalAlpha=alpha;c.fillStyle=gr;c.fillRect(x-r,y-r,r*2,r*2);c.globalAlpha=1}
function drawMap(){for(let y=0;y<R;y++)for(let x=0;x<C;x++){const k=idx(x,y),v=rand(x,y);if(map[k]){tile(x,y,v>.5?'#34393c':'#30363b');c.strokeStyle='#434a4e';c.lineWidth=1;c.strokeRect(x*T+.5,y*T+.5,T-1,T-1);if(v>.84){c.fillStyle='#52595b';c.fillRect(x*T+5,y*T+6,3,3);c.fillRect(x*T+24,y*T+24,3,3)}if((x+y)%7===0){c.fillStyle='#4a4f50';c.fillRect(x*T+13,y*T+15,6,2)}}else{tile(x,y,'#05070b');let adjacent=false;for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]])if(inside(x+dx,y+dy)&&map[idx(x+dx,y+dy)])adjacent=true;if(adjacent){tile(x,y,'#687078');c.fillStyle='#889098';c.fillRect(x*T+2,y*T+2,T-4,5);c.fillStyle='#202a32';c.fillRect(x*T+4,y*T+10,T-8,T-12);c.strokeStyle='#111921';c.strokeRect(x*T+2,y*T+2,T-4,T-4);if(v>.55){c.fillStyle='#c3bd74';c.fillRect(x*T+6,y*T+6,5,3)}}}}}
function roomOfTile(x,y){return rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)}

function drawAmbient(t){
 c.save();
 for(const r of rooms){
  const x=r.x*T,y=r.y*T,w=r.w*T,h=r.h*T;
  const grad=c.createLinearGradient(x,y,x+w,y+h);
  grad.addColorStop(0,'#ffffff08');grad.addColorStop(.52,'#ffffff00');grad.addColorStop(1,'#00000024');
  c.fillStyle=grad;c.fillRect(x,y,w,h);
  for(let j=0;j<r.w-1;j+=2){
   const bx=(r.x+j)*T+6,by=(r.y+r.h-1)*T+15;
   c.fillStyle=r.color;c.globalAlpha=.24+.16*Math.sin(t*.0015+j);
   c.fillRect(bx,by,18,3);
  }
 }
 c.globalAlpha=1;c.restore();
}
function drawAtmosphere(t){
 c.save();
 for(const r of rooms){
  const px=(r.x+r.w/2)*T,py=(r.y+r.h/2)*T;
  const alpha=.11+.035*Math.sin(t*.001+r.id);
  glow(px,py,Math.min(r.w*T*.55,270),r.color,alpha);
 }
 c.restore();
}
function drawDeskActivity(t){
 for(const a of crew){
  if(!a.work||a.path.length)continue;
  const ox=a.x*T,oy=a.y*T;
  c.save();c.globalAlpha=.45+.3*Math.sin(t*.008+a.id);
  c.fillStyle='#a6ffe4';c.fillRect(ox+10,oy-19,3,2);c.fillRect(ox+15,oy-26,2,2);
  c.fillStyle='#ffffff';c.fillRect(ox-13,oy-27,2,2);c.restore();
 }
}
function drawObjects(t){for(const o of objects){const x=o.x*T,y=o.y*T;const blink=Math.sin(t*.003+o.x+o.y)*.15+.85;c.fillStyle='#090c12';c.fillRect(x+1,y+19,30,11);if(o.type==='plant'){c.fillStyle='#514238';c.fillRect(x+9,y+17,15,12);c.fillStyle='#33874e';c.fillRect(x+7,y+6,7,17);c.fillRect(x+18,y+4,7,18);c.fillStyle='#7cffa1';c.fillRect(x+12,y+2,8,13);continue}if(o.type==='reactor'){c.fillStyle='#737780';c.fillRect(x+3,y+3,26,24);c.fillStyle='#131b24';c.fillRect(x+6,y+6,20,18);c.fillStyle=o.color;c.globalAlpha=blink;c.fillRect(x+9,y+9,14,12);c.globalAlpha=1;c.fillStyle='#e7fff4';c.fillRect(x+13,y+11,6,6)}else{c.fillStyle='#777b81';c.fillRect(x+2,y+9,28,19);c.fillStyle='#262d37';c.fillRect(x+5,y+2,22,16);c.fillStyle=o.color;c.globalAlpha=blink;c.fillRect(x+7,y+4,18,11);c.globalAlpha=1;c.fillStyle='#c6ffed';c.fillRect(x+9,y+7,10,2);c.fillStyle='#11191b';c.fillRect(x+9,y+22,14,3)}if((o.x+o.y)%3===0)glow(x+16,y+12,28,o.color,.12)}}
function drawLabels(t){for(const r of rooms){const x=(r.x+r.w/2)*T,y=r.y*T+19;glow(x,y,55,r.color,.13);c.fillStyle='#070e12';c.fillRect(x-115,y-14,230,23);c.strokeStyle=r.color;c.lineWidth=1;c.strokeRect(x-115,y-14,230,23);c.fillStyle=r.color;c.textAlign='center';c.font='bold 12px monospace';c.fillText(r.name,x,y+1);c.font='9px monospace';c.fillStyle='#b3b9bf';c.fillText('SECTOR '+String(r.id+1).padStart(2,'0'),x,y+19);if(selected.type==='room'&&selected.id===r.id){c.strokeStyle='#eafff2';c.lineWidth=2;c.strokeRect(r.x*T-5,r.y*T-5,r.w*T+10,r.h*T+10)}}}
function drawActor(a,t){const x=Math.round(a.x*T),y=Math.round(a.y*T),move=a.state==='walking'||a.state==='patrol',step=move?Math.round(Math.sin(t*.013+a.phase)*3):0,bob=move?Math.round(Math.sin(t*.026+a.phase)):0;c.save();c.translate(x,y+bob);c.fillStyle='#0008';c.beginPath();c.ellipse(0,7,10,4,0,0,Math.PI*2);c.fill();c.fillStyle='#171b27';c.fillRect(-6,1+step,5,7);c.fillRect(2,1-step,5,7);c.fillStyle='#49536b';c.fillRect(-6,5+step,5,3);c.fillRect(2,5-step,5,3);c.fillStyle=a.color;c.fillRect(-8,-15,16,17);c.fillStyle='#ffffff35';c.fillRect(-7,-14,3,12);c.fillStyle='#161c25';c.fillRect(-5,-12,10,5);c.fillStyle='#9bf8fa';c.fillRect(-4,-11,8,3);c.fillStyle='#f0c6a2';c.fillRect(-6,-22,12,8);c.fillStyle='#ffe6c9';c.fillRect(-5,-21,3,4);c.fillStyle='#202838';c.fillRect(-7,-24,14,5);c.fillStyle=a.color;c.fillRect(-11,-14+step,3,12);c.fillRect(8,-14-step,3,12);c.fillStyle='#ffffff';c.fillRect(-4,-20,3,2);c.fillRect(2,-20,3,2);if(a.work){c.fillStyle='#78ffa9';c.fillRect(6,-28,4,4);if(!a.path.length){const pulse=.4+.5*Math.sin(t*.008+a.id);c.globalAlpha=pulse;c.fillStyle='#7df9d6';c.beginPath();c.arc(0,-14,15,0,Math.PI*2);c.strokeStyle='#6fffc5';c.lineWidth=1;c.stroke();c.globalAlpha=1}}if(selected.type==='agent'&&selected.id===a.id){c.strokeStyle='#fff';c.lineWidth=2;c.strokeRect(-15,-29,30,42)}c.textAlign='center';c.font='bold 10px monospace';c.fillStyle='#070a0c';c.fillRect(-a.name.length*3.5-3,-41,a.name.length*7+6,11);c.fillStyle=a.color;c.fillText(a.name,0,-32);c.restore()}
function draw(t){c.fillStyle='#03070b';c.fillRect(0,0,size.w,size.h);c.save();c.translate(size.w/2+cam.x,size.h/2+cam.y);c.scale(cam.z,cam.z);for(const s of stars){c.fillStyle='#54616c';c.fillRect(s.x,s.y,s.s,s.s)}drawMap();drawAmbient(t);for(const r of rooms){glow((r.x+r.w/2)*T,(r.y+r.h/2)*T,Math.max(r.w,r.h)*T*.58,r.color,.055)}drawObjects(t);drawLabels(t);for(const a of crew)drawActor(a,t);drawDeskActivity(t);c.restore()}
function findSeat(room){const r=rooms[room];return r.seats[(Math.floor(time*3)+room*7)%r.seats.length]||near(r.x+2,r.y+2)}
function navigate(a,room){const p=findSeat(room),start=near(Math.floor(a.x),Math.floor(a.y));a.path=route(start[0],start[1],p[0],p[1]);a.target=room;if(!a.path.length){a.wait=3;return false}return true}
function assign(){for(const task of tasks){if(task.status!=='queued')continue;const a=crew[task.agent];if(a&&!a.work){a.work=task.id;task.status='active';navigate(a,task.room);log(a.name+' assigned '+task.title)}}}
function simulate(dt){time+=dt;assign();for(const a of crew){if(a.path.length){const p=a.path[0],tx=p[0]+.5,ty=p[1]+.5,dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<.06){a.x=tx;a.y=ty;a.path.shift();a.state=a.path.length?'walking':a.work?'working':'idle';if(!a.path.length)a.room=a.target}else{const step=Math.min(d,dt*2.0);a.x+=dx/d*step;a.y+=dy/d*step;a.dir=Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;a.state='walking'}}else if(a.work){const task=tasks.find(t=>t.id===a.work);a.state='working';if(task&&task.status==='active'&&task.kind==='live'){a.state='working';runLive(task)}else if(task&&task.status==='running'){a.state='working'}else if(task&&task.status==='active'){task.progress=Math.min(100,task.progress+dt*100/(task.duration||45));if(task.progress>=100){task.status='done';task.result='Simulated mission timer completed; no external action was performed.';a.work=null;a.state='idle';a.wait=2;log(a.name+' finished local simulation: '+task.title)}}else a.work=null}else{a.wait-=dt;a.state='idle';if(a.wait<=0){const room=(a.room+1+(a.id%4))%rooms.length;navigate(a,room);a.wait=3+a.id%6}}}}

const LIVE_TYPES={
 leads:{label:'Inspect real HYDRA lead issue',room:1,agent:6},
 workflow:{label:'Verify revenue-watch workflow runs',room:8,agent:2},
 deployment:{label:'Verify iPhone deployment',room:0,agent:0},
 catalog:{label:'Inspect public service storefront source',room:5,agent:4}
};
function makeLive(kind){
 const def=LIVE_TYPES[kind];if(!def)return;
 const task={id:nextId++,title:def.label,room:def.room,agent:def.agent,duration:0,progress:0,status:'queued',kind:'live',liveType:kind,note:'Read-only public GitHub API check; no authenticated accounts or submissions.'};
 tasks.push(task);log('Queued live check: '+task.title);taskRender();save();select('task',task.id);notice('Live check queued for '+crew[task.agent].name);
}
function safeLink(u){try{const url=new URL(u);return url.protocol==='https:'?url.href:null}catch{return null}}
async function publicJSON(path){
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);
 try{
  const response=await fetch('https://api.github.com/repos/p1ngtoohigh/Jarvus-Pub/'+path,{headers:{Accept:'application/vnd.github+json'},signal:ctrl.signal,cache:'no-store'});
  if(!response.ok)throw Error('GitHub HTTP '+response.status+(response.status===403?' (rate limit or access denied)':''));
  return await response.json();
 }finally{clearTimeout(timer)}
}
async function runLive(task){
 if(task.status!=='active')return;
 task.status='running';task.progress=10;log('Checking public source: '+task.title);save();
 try{
  let lines=[],links=[];
  if(task.liveType==='leads'){
   const issue=await publicJSON('issues/1');
   if(!issue||!issue.html_url)throw Error('Lead issue not found');
   const match=[...(issue.body||'').matchAll(/https:\/\/github\.com\/[^\s)>\]]+/g)].slice(0,7).map(x=>x[0]);
   lines=['Lead issue: '+issue.title,'Updated: '+issue.updated_at,'Public candidate links in issue: '+match.length,...match.map(x=>'• '+x),'These are leads, not won contracts or revenue.'];
   links=[issue.html_url,...match];
  }else if(task.liveType==='workflow'||task.liveType==='deployment'){
   const data=await publicJSON('actions/runs?per_page=35');
   const name=task.liveType==='workflow'?'HYDRA paid work watch':'Publish HYDRA iPhone';
   const runs=(data.workflow_runs||[]).filter(r=>r.name===name).slice(0,5);
   if(!runs.length)throw Error('No matching workflow runs found');
   lines=['Workflow: '+name,...runs.map(r=>r.created_at+' · '+r.status+' / '+(r.conclusion||'pending')),'A successful run does not prove customers or revenue.'];
   links=runs.map(r=>r.html_url);
  }else if(task.liveType==='catalog'){
   const file=await publicJSON('contents/services.html');
   lines=['Public services page: '+file.path,'Latest content SHA: '+file.sha,'Size: '+file.size+' bytes','This verifies a repository file, not customer orders.'];
   links=[file.html_url,'https://p1ngtoohigh.github.io/Jarvus-Pub/services.html'];
  }else throw Error('Unknown check');
  task.result=lines.join('\n');task.links=links.filter(safeLink).slice(0,9);task.progress=100;task.status='verified';log('Verified public data: '+task.title);
 }catch(e){task.status='failed';task.result='Unable to verify public data: '+String(e.message||e);task.progress=0;task.links=[];log('Live check failed: '+task.title)}
 const a=crew[task.agent];if(a?.work===task.id){a.work=null;a.state='idle';a.wait=2}save();taskRender();if(selected.type==='task'&&selected.id===task.id)inspect();
}
function crewRender(){$('crew').innerHTML=crew.filter(a=>filter==='all'||(filter==='busy'?!!a.work:!a.work)).map(a=>'<div class="unit '+(selected.type==='agent'&&selected.id===a.id?'on':'')+'" data-agent="'+a.id+'"><span class="portrait" style="color:'+a.color+'">'+a.name.slice(0,2)+'</span><span class="txt"><b>'+a.name+'</b><small>'+escapeHTML(a.role)+'</small></span><em>'+(!a.work?'IDLE':a.path.length?'MOVE':'WORK')+'</em></div>').join('')}
function taskRender(){$('nq').textContent=tasks.filter(t=>t.status==='active'||t.status==='queued').length;$('missions').innerHTML=tasks.slice(-8).reverse().map(t=>'<div class="mission" data-task="'+t.id+'"><b>'+escapeHTML(t.title)+'</b><small>'+(t.kind==='live'?'LIVE READ-ONLY':'SIMULATION')+' · '+escapeHTML(t.status)+' / '+(crew[t.agent]?.name||'UNKNOWN')+'</small><div class="bar"><i style="width:'+Math.min(100,t.progress||0)+'%"></i></div></div>').join('')}

function resultHTML(t){
 const txt=t.result?'<p style="white-space:pre-wrap;overflow-wrap:anywhere">'+escapeHTML(t.result)+'</p>':'<p>Awaiting assignment or network result.</p>';
 const links=(t.links||[]).filter(safeLink).map(u=>'<p><a href="'+escapeHTML(u)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(u.length>65?u.slice(0,65)+'…':u)+'</a></p>').join('');
 return '<div class="k">RESULT / '+(t.kind==='live'?'LIVE PUBLIC DATA':'LOCAL SIMULATION')+'</div>'+txt+links;
}
function inspect(){if(selected.type==='agent'){const a=crew[selected.id],task=tasks.find(t=>t.id===a.work);$('info').innerHTML='<h3>'+a.name+'</h3><div class="k">'+escapeHTML(a.role.toUpperCase())+' / CREW</div><p>Mode: '+escapeHTML(a.state)+'<br>Sector: '+rooms[a.room].name+'<br>Task: '+escapeHTML(task?.title||'No assignment')+'</p><button id="follow">⌖ FOLLOW AGENT</button><button id="assign">＋ ASSIGN MISSION</button><p class="warn">Animated character; not a connected AI process.</p>'}else if(selected.type==='task'){const t=tasks.find(x=>x.id===selected.id);if(!t){selected={type:'room',id:3};inspect();return}$('info').innerHTML='<h3>'+escapeHTML(t.title)+'</h3><div class="k">MISSION / '+escapeHTML(t.status.toUpperCase())+'</div><p>'+escapeHTML(t.note||'Simulation only.')+'</p><p>Agent: '+crew[t.agent].name+'<br>Room: '+rooms[t.room].name+'<br>Progress: '+Math.round(t.progress||0)+'%</p>'+resultHTML(t)+'<button id="cancel" '+(t.status==='done'||t.status==='cancelled'?'disabled':'')+'>CANCEL TASK</button><p class="warn">Completion is simulated, not real paid work.</p>'}else{const r=rooms[selected.id];$('info').innerHTML='<h3>'+r.name+'</h3><div class="k">SECTOR '+String(r.id+1).padStart(2,'0')+'</div><p>'+r.desc+'</p><p>Personnel: '+crew.filter(a=>a.room===r.id).map(a=>a.name).join(', ')+'</p><button id="focus">⌖ CENTER ROOM</button><button id="assign">＋ NEW ROOM MISSION</button><button id="stationLive">◉ RUN LIVE PUBLIC CHECK</button><p class="warn">Backend telemetry disconnected.</p>'}}
function select(type,id){selected={type,id};inspect();crewRender()}

function terminalModal(){
 const recent=tasks.filter(t=>t.kind==='live').slice(-6).reverse().map(t=>'<div style="padding:8px;border-bottom:1px solid #356b50"><b>'+escapeHTML(t.title)+'</b><br><small>'+escapeHTML(t.status)+'</small><button data-open-task="'+t.id+'">VIEW RESULT</button></div>').join('')||'<p>No live checks yet.</p>';
 modal('<h2>HYDRA OPERATOR TERMINAL</h2><p>These checks use the public GitHub API. They inspect actual repository records, but do not execute external jobs, contact clients, trade, or verify revenue.</p><button data-live="leads">◉ SCAN PUBLIC LEADS</button><button data-live="workflow">◉ CHECK WORK MONITOR</button><button data-live="deployment">◉ CHECK IPHONE DEPLOY</button><button data-live="catalog">◉ CHECK SERVICE SOURCE</button><h2>RECENT OPERATIONS</h2>'+recent+'<button id="close">CLOSE</button>');
}
function taskModal(agent=0,room=3){modal('<h2>NEW SIMULATED MISSION</h2><p>Agents will navigate through walkable doors and around equipment. This does not run Jarvis or perform client work.</p><label>Mission name</label><input id="title" maxlength="90" placeholder="Inspect a client lead"><label>Agent</label><select id="agent">'+crew.map(a=>'<option value="'+a.id+'" '+(a.id===agent?'selected':'')+'>'+a.name+'</option>').join('')+'</select><label>Room</label><select id="room">'+rooms.map(r=>'<option value="'+r.id+'" '+(r.id===room?'selected':'')+'>'+r.name+'</option>').join('')+'</select><label>Notes</label><textarea id="note" maxlength="600"></textarea><button id="submit">QUEUE MISSION</button><button id="close">CLOSE</button>')}
function modal(html){$('modal').innerHTML=html;$('modalback').classList.add('open')}function close(){$('modalback').classList.remove('open')}
$('crew').onclick=e=>{const x=e.target.closest('[data-agent]');if(x){const a=crew[+x.dataset.agent];select('agent',a.id);cam.x=-a.x*T*cam.z;cam.y=-a.y*T*cam.z}};
$('missions').onclick=e=>{const x=e.target.closest('[data-task]');if(x)select('task',+x.dataset.task)};
$('left').querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));crewRender()}};
$('info').onclick=e=>{const id=e.target.id;if(id==='follow'){const a=crew[selected.id];cam.x=-a.x*T*cam.z;cam.y=-a.y*T*cam.z}else if(id==='focus'){const r=rooms[selected.id];cam.x=-(r.x+r.w/2)*T*cam.z;cam.y=-(r.y+r.h/2)*T*cam.z}else if(id==='assign')taskModal(selected.type==='agent'?selected.id:0,selected.type==='room'?selected.id:crew[selected.id].room);else if(id==='stationLive'){const map=['deployment','leads','workflow','deployment','workflow','catalog','leads','workflow','workflow'];makeLive(map[selected.id]||'leads')}else if(id==='cancel'){const t=tasks.find(x=>x.id===selected.id);if(t){t.status='cancelled';const a=crew[t.agent];if(a.work===t.id){a.work=null;a.path=[]}log('Cancelled simulated task '+t.title);taskRender();inspect();save()}}};
$('modal').onclick=e=>{const id=e.target.id;const live=e.target.closest('[data-live]');if(live){makeLive(live.dataset.live);close();return}const open=e.target.closest('[data-open-task]');if(open){select('task',+open.dataset.openTask);close();return}if(id==='close')close();else if(id==='submit'){const title=$('title').value.trim();if(!title){notice('Enter a task title');return}const task={id:nextId++,title,agent:+$('agent').value,room:+$('room').value,duration:35+title.length%40,progress:0,status:'queued',note:$('note').value.trim()||'Simulation only.'};tasks.push(task);log('Queued simulation: '+title);save();taskRender();close();select('task',task.id)}else if(id==='export'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({mode:'local simulation',tasks,logs},null,2)],{type:'application/json'}));a.href=u;a.download='hydra-simulated-missions.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else if(id==='reset'){if(confirm('Reset local simulation state?')){localStorage.removeItem(storeKey);location.reload()}}};
$('modalback').onclick=e=>{if(e.target===$('modalback'))close()};
$('help').onclick=()=>modal('<h2>HYDRA LIVING STATION</h2><p>Drag to pan, pinch or scroll to zoom, select agents or rooms. Characters follow walkable tiles and corridors, avoiding walls and solid workstations. Assign missions, inspect crew, pause and change speed.</p><p>Character movement and demo missions are local simulations. The OPERATOR TERMINAL can retrieve real, read-only public GitHub information and display links and results. Jarvis is not connected; no clients contacted, no paid jobs completed, no trades placed. Task progress and logs persist in this browser only.</p><button id="export">EXPORT SIMULATION LOG</button><button id="reset">RESET LOCAL STATE</button><button id="close">CLOSE</button>');
$('theme').onclick=()=>{theme=theme==='green'?'magenta':theme==='magenta'?'blue':'green';themeApply();save()};
$('new').onclick=()=>taskModal();$('scan').onclick=()=>makeLive('leads');$('terminal').onclick=terminalModal;$('plus').onclick=()=>cam.z=Math.min(2.5,cam.z*1.25);$('minus').onclick=()=>cam.z=Math.max(.22,cam.z/1.25);$('center').onclick=()=>{resize.did=false;resize()};$('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ';e.target.classList.toggle('on',paused)};$('speed').onclick=e=>{speed=speed===1?2:speed===2?4:speed===4?.5:1;e.target.textContent=speed+'×'};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointer.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture=pointer.size===1?{distance:0}:null});
cv.addEventListener('pointermove',e=>{if(!pointer.has(e.pointerId))return;const old=pointer.get(e.pointerId);pointer.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointer.values()];if(p.length===2){const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pointer.prev)cam.z=Math.max(.22,Math.min(2.5,cam.z*d/pointer.prev));pointer.prev=d}else if(gesture){cam.x+=e.clientX-old.x;cam.y+=e.clientY-old.y;gesture.distance+=Math.abs(e.clientX-old.x)+Math.abs(e.clientY-old.y)}});
function end(e){if(gesture&&gesture.distance<12&&pointer.size===1){const p=screenToWorld(e.clientX,e.clientY),a=crew.find(a=>Math.hypot(a.x*T-p.x,a.y*T-p.y)<19);if(a)select('agent',a.id);else{const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T),r=roomOfTile(tx,ty);if(r)select('room',r.id)}}pointer.delete(e.pointerId);if(!pointer.size){gesture=null;pointer.prev=null}}cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.22,Math.min(2.5,cam.z*(e.deltaY>0?.88:1.12)))},{passive:false});
let accum=0;function tick(t){const dt=Math.min((t-last)/1000,.06);last=t;if(!paused)simulate(dt*speed);draw(t);accum+=dt;if(accum>.65){accum=0;crewRender();taskRender();if(selected.type!=='task')inspect();$('time').textContent=new Date(time*1000).toISOString().slice(11,19);$('active').textContent=crew.filter(a=>a.work).length;$('cycle').textContent='CYCLE '+String(Math.floor(time/20)).padStart(4,'0')}requestAnimationFrame(tick)}
window.addEventListener('resize',resize);resize();select('room',3);taskRender();log('Station online: navigation mesh active; Jarvis offline');requestAnimationFrame(tick);
})();
</script></body></html>
